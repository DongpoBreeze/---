name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24.18.0'
          cache: npm

      - run: npm ci

      # Typecheck plus unit, gateway and script tests. Browser (Playwright) tests
      # need a running Expo web server and stay local for now.
      - run: npm run test:all
