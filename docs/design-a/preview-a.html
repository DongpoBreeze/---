<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>方案 A：温暖浅色</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #F8F7F5;
      padding: 20px;
      min-height: 100vh;
    }
    .container { max-width: 390px; margin: 0 auto; }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .header-left { display: flex; flex-direction: column; gap: 4px; }
    .protocol { font-size: 11px; font-weight: 600; color: #999; letter-spacing: 1px; }
    .days { font-size: 12px; color: #999; }
    .date { font-size: 32px; font-weight: 800; color: #1A1A1A; line-height: 1.2; }
    .avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.04), 0 0 1px rgba(0,0,0,0.06);
    }

    .card-title {
      font-size: 11px;
      font-weight: 700;
      color: #999;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .card-subtitle {
      font-size: 13px;
      color: #666;
      margin-bottom: 16px;
    }

    .rhythm-bars {
      display: flex;
      align-items: flex-end;
      gap: 4px;
      height: 60px;
      margin-bottom: 12px;
    }
    .bar {
      flex: 1;
      background: #E8E8E8;
      border-radius: 2px;
      position: relative;
    }
    .bar.has-meal { background: rgba(232, 165, 71, 0.25); }
    .bar.has-training { background: rgba(74, 153, 138, 0.25); }
    .bar.has-sleep { background: rgba(72, 84, 184, 0.25); }
    .bar.current {
      outline: 2px solid #1A1A1A;
      outline-offset: 2px;
    }

    .time-labels {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #999;
      margin-bottom: 12px;
    }

    .legend {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 12px;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 2px;
    }
    .dot-meal { background: rgba(232, 165, 71, 0.6); }
    .dot-training { background: rgba(74, 153, 138, 0.6); }
    .dot-sleep { background: rgba(72, 84, 184, 0.6); }
    .now-badge {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 4px;
      color: #E84839;
    }
    .now-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E84839;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .empty-state {
      text-align: center;
      padding: 32px 0;
    }
    .empty-icon {
      font-size: 48px;
      margin-bottom: 12px;
      opacity: 0.3;
    }
    .empty-number {
      font-size: 56px;
      font-weight: 800;
      color: #E8E8E8;
      line-height: 1;
      margin-bottom: 8px;
    }
    .empty-label {
      font-size: 14px;
      font-weight: 600;
      color: #CCC;
    }
    .empty-hint {
      font-size: 13px;
      color: #AAA;
      margin-top: 12px;
    }

    .action-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .action-btn {
      height: 56px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .action-btn:active {
      transform: scale(0.98);
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .btn-meal {
      background: #1A1A1A;
      color: white;
    }
    .btn-training {
      background: white;
      color: #4A998A;
      border: 2px solid #4A998A;
    }
    .btn-sleep {
      background: white;
      color: #4854B8;
      border: 2px solid #4854B8;
    }

    .nutrition-card {
      border-top: 1px solid #F0F0F0;
      padding-top: 16px;
    }
    .nutrition-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .nutrition-title {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .nutrition-icon {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #E8A547;
    }
    .nutrition-badge {
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      background: #FFF3E0;
      color: #E8A547;
    }
    .nutrition-empty {
      font-size: 40px;
      font-weight: 800;
      color: #E8E8E8;
      margin-bottom: 8px;
    }
    .nutrition-status {
      display: flex;
      gap: 16px;
      font-size: 12px;
      color: #999;
    }
    .nutrition-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
    }
    .nutrition-item {
      background: #FAFAFA;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
    }
    .nutrition-label {
      font-size: 12px;
      color: #999;
      margin-bottom: 4px;
    }
    .nutrition-value {
      font-size: 16px;
      font-weight: 700;
      color: #CCC;
    }

    .summary-card {
      background: #FAFAFA;
      border: 1px solid #F0F0F0;
    }
    .summary-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .summary-badges {
      display: flex;
      gap: 6px;
    }
    .badge {
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
    }
    .badge-local {
      background: #E8E8E8;
      color: #666;
    }
    .badge-wait {
      background: #E8F5E9;
      color: #4CAF50;
    }
    .summary-text {
      font-size: 13px;
      color: #999;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-left">
        <div class="protocol">DAILY PROTOCOL</div>
        <div class="days">已记 0 天</div>
        <div class="date">10月18日星期日</div>
      </div>
      <div class="avatar">👤</div>
    </div>

    <div class="card">
      <div class="card-title">24H RHYTHM MATRIX</div>
      <div class="card-subtitle">24格节律矩阵·实时映射三项生理记录</div>

      <div class="rhythm-bars">
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 25%;"></div>
        <div class="bar current" style="height: 85%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 25%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 25%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 25%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 25%;"></div>
        <div class="bar" style="height: 20%;"></div>
        <div class="bar" style="height: 15%;"></div>
      </div>

      <div class="time-labels">
        <span>00:00</span>
        <span>06:00</span>
        <span>12:00</span>
        <span>18:00</span>
        <span>23:00</span>
      </div>

      <div class="legend">
        <div class="legend-item">
          <div class="legend-dot dot-sleep"></div>
          <span>睡眠</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot dot-meal"></div>
          <span>饮食</span>
        </div>
        <div class="legend-item">
          <div class="legend-dot dot-training"></div>
          <span>训练</span>
        </div>
        <div class="now-badge">
          <div class="now-dot"></div>
          <span>NOW 02:38</span>
        </div>
      </div>
    </div>

    <div class="empty-state">
      <div class="empty-number">0</div>
      <div class="empty-label">条今日记录</div>
      <div class="empty-hint">轻触下方按钮记录今天第一笔数据</div>
    </div>

    <div class="action-buttons">
      <button class="action-btn btn-meal">
        <span>📷</span>
        <span>记饮食</span>
      </button>
      <button class="action-btn btn-training">
        <span>🏋️</span>
        <span>记训练</span>
      </button>
      <button class="action-btn btn-sleep">
        <span>🌙</span>
        <span>记睡眠</span>
      </button>
    </div>

    <div class="card">
      <div class="nutrition-card">
        <div class="nutrition-header">
          <div class="nutrition-title">
            <div class="nutrition-icon"></div>
            <div class="card-title">01 / NUTRITION · 今日饮食汇总</div>
          </div>
          <div class="nutrition-badge">已记 0 餐</div>
        </div>

        <div class="nutrition-empty">未知</div>
        <div class="nutrition-status">
          <span>有营养估算 0 餐</span>
          <span>信息不足 0 餐</span>
        </div>

        <div class="nutrition-grid">
          <div class="nutrition-item">
            <div class="nutrition-label">蛋白质 P</div>
            <div class="nutrition-value">—</div>
          </div>
          <div class="nutrition-item">
            <div class="nutrition-label">碳水 C</div>
            <div class="nutrition-value">—</div>
          </div>
          <div class="nutrition-item">
            <div class="nutrition-label">脂肪 F</div>
            <div class="nutrition-value">—</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card summary-card">
      <div class="summary-header">
        <div class="card-title">AI SYNTHESIS</div>
        <div class="summary-badges">
          <div class="badge badge-local">本地估算</div>
          <div class="badge badge-wait">等待今日记录</div>
        </div>
      </div>
      <div style="font-size: 20px; font-weight: 800; color: #1A1A1A; margin-bottom: 8px;">
        今日健康总结
      </div>
      <div class="summary-text">
        暂无记录，开始今天的第一笔数据记录后，AI 将为您生成个性化的健康总结。
      </div>
    </div>
  </div>
</body>
</html>
